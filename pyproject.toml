[project]
name = "AdventOfCode-python"
version = "0.1.0"
description = "Advent of Code solutions written in Python"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.1",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.1",
    "regex>=2026.1.15",
    "requests>=2.32.5",
]

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle errors
    "B",   # flake8-bugbear
    "I",   # isort
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501" # lines too long
]
